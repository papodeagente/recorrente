# RECORRENTE — dev stack.
#
# Sobe Postgres + Redis + app (Next) + worker (BullMQ) com hot-reload.
# Em produção, app e worker viram containers separados no Coolify usando
# Dockerfile multi-stage (target=runner) e Dockerfile.worker respectivamente.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recorrente
      POSTGRES_PASSWORD: recorrente
      POSTGRES_DB: recorrente_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recorrente -d recorrente_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://recorrente:recorrente@postgres:5432/recorrente_dev
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-rotate-in-prod-32bytes}
      APP_URL: http://localhost:3000
      NODE_ENV: development
      LOG_LEVEL: debug
      RUNTIME_ROLE: web
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next_cache:/app/.next
    command: npm run dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://recorrente:recorrente@postgres:5432/recorrente_dev
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-rotate-in-prod-32bytes}
      NODE_ENV: development
      LOG_LEVEL: debug
      RUNTIME_ROLE: worker
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    command: npm run worker:dev

volumes:
  pg_data:
  redis_data:
  app_node_modules:
  app_next_cache:
  worker_node_modules:
